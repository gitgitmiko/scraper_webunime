name: Repair reported episode

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Anime slug (samehadaku)
        required: true
        type: string
      episode:
        description: Nomor episode (contoh 12 atau 12.1)
        required: true
        type: string

run-name: Repair ${{ inputs.slug }} ep ${{ inputs.episode }}

permissions:
  contents: read

concurrency:
  group: repair-episode
  cancel-in-progress: false

jobs:
  repair:
    name: Repair one episode (TV + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout WEBUNIME
        uses: actions/checkout@v4
        with:
          repository: gitgitmiko/WEBUNIME
          ref: main
          token: ${{ secrets.WEBUNIME_TOKEN }}
          path: webunime

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webunime/package-lock.json

      - name: Install dependencies
        working-directory: webunime
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: webunime
        run: npx playwright install --with-deps chromium

      - name: Repair episode
        working-directory: webunime
        run: npm run repair:episode -- --slug "${{ inputs.slug }}" --episode "${{ inputs.episode }}"
        env:
          CI: true

      - name: Publish catalog
        if: success()
        working-directory: webunime
        run: |
          set -e
          git config user.name "webunime-scraper[bot]"
          git config user.email "webunime-scraper[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan katalog."
            exit 0
          fi
          git commit -m "$(cat <<EOF
          fix(data): refresh player ${{ inputs.slug }} ep ${{ inputs.episode }}

          EOF
          )"
          git pull --rebase origin main
          git push origin HEAD:main
